<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <div class="container">

    <!-- ===== Header ===== -->
    <h1>Expense &amp; Budget Visualizer</h1>

    <!-- ===== Total Balance Card ===== -->
    <div class="card balance-card">
      <p class="balance-label">TOTAL BALANCE</p>
      <p class="balance-amount" id="totalBalance">$0.00</p>
    </div>

    <!-- ===== Monthly Summary Card ===== -->
    <div class="card summary-card">
      <h2>Monthly Summary</h2>
      <div class="summary-grid">
        <div class="summary-item">
          <span class="summary-label">Total Spent</span>
          <span class="summary-value" id="monthlyTotal">$0.00</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Transactions</span>
          <span class="summary-value" id="monthlyCount">0</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Top Category</span>
          <span class="summary-value" id="monthlyTop">N/A</span>
        </div>
      </div>
    </div>

    <!-- ===== Add Transaction Form ===== -->
    <div class="card form-card">
      <h2>Add Transaction</h2>
      <div class="form-fields">
        <div class="field-group">
          <label for="txName">Item Name</label>
          <input
            type="text"
            id="txName"
            placeholder="e.g. Burger"
            maxlength="60"
            autocomplete="off"
          />
        </div>
        <div class="field-group">
          <label for="txAmount">Amount</label>
          <input
            type="number"
            id="txAmount"
            placeholder="e.g. 12.50"
            step="0.01"
            min="0.01"
            max="999999999.99"
          />
        </div>
        <div class="field-group">
          <label for="txCategory">Category</label>
          <select id="txCategory">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
        </div>
        <button class="btn-add" id="addBtn">Add Transaction</button>
      </div>
      <p class="form-error" id="formError" aria-live="polite"></p>
    </div>

    <!-- ===== Controls Section ===== -->
    <div class="card controls-card">
      <div class="controls-grid">
        <div class="field-group">
          <label for="spendingLimit">Spending Alert Limit ($)</label>
          <input
            type="number"
            id="spendingLimit"
            placeholder="e.g. 100"
            step="0.01"
            min="0.01"
          />
        </div>
        <div class="field-group">
          <label for="sortSelect">Sort By</label>
          <select id="sortSelect">
            <option value="newest">Newest First</option>
            <option value="highest">Highest Amount</option>
            <option value="lowest">Lowest Amount</option>
            <option value="category">Category A-Z</option>
          </select>
        </div>
        <div class="field-group theme-group">
          <label for="themeToggle">Dark Mode</label>
          <label class="toggle-switch">
            <input type="checkbox" id="themeToggle" />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
    </div>

    <!-- ===== Bottom Section ===== -->
    <div class="bottom-grid">

      <!-- Left: Transaction List -->
      <div class="card list-card">
        <h2>Transactions</h2>
        <ul class="tx-list" id="txList" aria-label="Transaction list"></ul>
        <p class="empty-msg" id="listEmpty">No transactions yet.</p>
      </div>

      <!-- Right: Pie Chart -->
      <div class="card chart-card">
        <h2>Spending by Category</h2>
        <div class="chart-wrap">
          <canvas id="pieChart" aria-label="Spending by category" role="img"></canvas>
        </div>
        <p class="empty-msg" id="chartEmpty">No data yet.</p>
        <p class="empty-msg" id="chartUnavailable" style="display:none;">Chart unavailable — could not load Chart.js.</p>
      </div>

    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
